<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Club Marketplace — Primeiro acesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --cmx-texto:#1b2430; --cmx-texto-suave:#6b7684;
    --cmx-borda:#e4e7eb; --cmx-ambar:#2baff2; --cmx-ambar-fundo:#e6f7ff;
    --cmx-rust:#c1502e; --cmx-rust-fundo:#fbe9e3;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Inter",sans-serif; color:var(--cmx-texto); background:#ffffff; }

  .fundo { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }

  .area-logo { display:flex; flex-direction:column; align-items:center; margin-bottom:28px; }
  .logo-placeholder {
    width:100px; height:100px; border-radius:24px; background:var(--cmx-ambar); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:"Lora",serif; font-weight:700; font-size:46px;
    margin-bottom:14px;
  }
  .area-logo .nome { font-family:"Lora",serif; font-weight:700; font-size:22px; color:var(--cmx-texto); }

  .selo-topo { margin-bottom:20px; }
  .selo-topo span { background:var(--cmx-ambar-fundo); color:#1c98d6; font-size:12px; font-weight:600; padding:5px 14px; border-radius:999px; }

  .form-login { width:100%; max-width:400px; }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:7px; margin-top:18px; }
  label:first-of-type { margin-top:0; }
  input[type="text"], input[type="password"] {
    width:100%; padding:13px 15px; border-radius:10px; border:1.5px solid var(--cmx-borda);
    font-family:inherit; font-size:15px; color:var(--cmx-texto); background:#fff;
  }
  input:focus { outline:none; border-color:var(--cmx-ambar); }
  button[type="submit"] {
    width:100%; margin-top:26px; padding:15px; border:none; border-radius:999px;
    background:var(--cmx-ambar); color:#fff; font-weight:700; font-size:15.5px; cursor:pointer;
    box-shadow:0 10px 28px -8px rgba(43,175,242,.5);
  }
  button[type="submit"]:hover { background:#1c98d6; }

  .rodape-login { text-align:center; margin-top:22px; font-size:12.5px; color:var(--cmx-texto-suave); }
  .rodape-login a { color:var(--cmx-texto); font-weight:600; text-decoration:none; }
  .rodape-site { margin-top:48px; font-size:13px; color:var(--cmx-texto-suave); }

  .alerta-erro { background:var(--cmx-rust-fundo); color:var(--cmx-rust); font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:16px; max-width:400px; width:100%; }
  .dica { font-size:11.5px; color:var(--cmx-texto-suave); margin-top:5px; }
</style>
</head>
<body>
<div class="fundo">
  <div class="area-logo">
    <img src="/static/logo.png" alt="Club Marketplace" style="width:220px; height:auto;" />
  </div>

  <div class="selo-topo"><span>Primeiro acesso</span></div>

  {% if erro %}
  <div class="alerta-erro">{{ erro }}</div>
  {% endif %}

  <form class="form-login" method="post" action="/primeiro-acesso">
    <label>Usuário</label>
    <input type="text" name="usuario" placeholder="seu.usuario" autocomplete="username" required autofocus value="{{ usuario_preenchido or '' }}" />

    <label>Código de primeiro acesso</label>
    <input type="text" name="codigo" placeholder="Código enviado pelo supervisor" autocomplete="off" required />

    <label>Crie sua senha pessoal</label>
    <input type="password" name="nova_senha" autocomplete="new-password" required minlength="8" />
    <div class="dica">Mínimo 8 caracteres</div>

    <label>Confirme a senha</label>
    <input type="password" name="confirmar_senha" autocomplete="new-password" required minlength="8" />

    <button type="submit">Criar senha e entrar</button>
  </form>

  <div class="rodape-login">
    Já tem senha? <a href="/login">Fazer login</a>
  </div>

  <div class="rodape-site">clubmarketplace.com.br</div>
</div>
</body>
</html>
