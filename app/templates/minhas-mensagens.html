<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Club Marketplace — Mensagens pós-venda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/dashboard.css?v=7" />
  <style>
    :root { --cmx-azul:#2baff2; }
    main { max-width:1180px; margin:0 auto; padding:24px 24px 60px; }
    @media (max-width: 700px) { header { padding:14px 16px; } main { padding:16px 12px 50px; } }
  </style>
</head>
<body>
  <div class="cmx-shell">
    <aside class="cmx-sidebar">
      <div class="cmx-marca">
        <img class="cmx-marca-logo" src="/static/logo.png?v=2" alt="Club Marketplace" style="width:100%; max-width:196px; height:auto; background:#fff; border-radius:8px; padding:10px 12px; display:block;" />
      </div>
      {% include "_menu_auto.html" %}
    </aside>

    <div class="cmx-conteudo">
      <div class="cmx-menu-usuario">
        <div class="cmx-menu-usuario-botao" onclick="document.getElementById('cmx-dropdown-usuario').classList.toggle('aberto')">
          <div class="cmx-menu-usuario-avatar">{{ usuario.nome_exibicao[0]|upper }}</div>
          <div>
            <div class="cmx-menu-usuario-nome">{{ usuario.nome_exibicao }}</div>
            <div class="cmx-menu-usuario-papel">{{ usuario.conta_vinculada }}</div>
          </div>
          <span style="font-size:10px; color:var(--cmx-texto-suave);">▾</span>
        </div>
        <div class="cmx-menu-usuario-dropdown" id="cmx-dropdown-usuario">
          <a href="/logout">🚪 Sair</a>
        </div>
      </div>
      <script>
        document.addEventListener("click", function(e) {
          var menu = document.querySelector(".cmx-menu-usuario");
          var dropdown = document.getElementById("cmx-dropdown-usuario");
          if (menu && dropdown && !menu.contains(e.target)) dropdown.classList.remove("aberto");
        });
      </script>

      <header class="cmx-topbar">
        <div>
          <h1>Mensagens pós-venda</h1>
          <p class="cmx-subtitulo">Perguntas dos compradores depois da compra, da conta {{ usuario.conta_vinculada }} -- responda aqui e o comprador recebe pelo Mercado Livre</p>
        </div>
      </header>

  <main>
    <div id="pv-app" data-base="/api/meu-pos-venda" data-modo="seller"></div>
  </main>
    </div>
  </div>
  <script src="/static/menu-celular.js?v=1"></script>
  <script src="/static/pos-venda-conversas.js?v=4"></script>
</body>
</html>
